services:
  sena-juicios:
    build: .
    image: sena-juicios:latest
    container_name: sena-juicios
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      SOFIA_CARPETA: /data/descargas
    volumes:
      - senajuicios:/data/descargas
    shm_size: "1gb"

volumes:
  senajuicios:
